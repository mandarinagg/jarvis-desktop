[project]
name = "jarvis-voice"
version = "0.0.1"
description = "JARVIS voice service (Phase 0: audio diagnostics only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "sounddevice>=0.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
jarvis-audio-check = "jarvis_voice.diagnostics.audio_check:main"
jarvis-stt-bench = "jarvis_voice.diagnostics.stt_bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_voice"]

[tool.uv]
# Smart App Control blocks uv's unsigned managed interpreters; use the
# PSF-signed Python from the official installer (`py install 3.12`).
python-preference = "only-system"

[tool.pytest.ini_options]
testpaths = ["tests"]
